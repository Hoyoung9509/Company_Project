server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    accesslog:
      enabled: true
      directory: C:/Users/wjdgh/IdeaProjects/Company_Project/logs
      prefix: access_log
      suffix: .log
      pattern: "%{CF-Connecting-IP}i %l %u %t \"%r\" %s %b %D"

logging:
  file:
    name: C:/Users/wjdgh/IdeaProjects/Company_Project/logs/app.log

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/company_homepage?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.company.homepage.vo
  configuration:
    map-underscore-to-camel-case: true

app:
  upload:
    dir: C:/Users/wjdgh/IdeaProjects/Company_Project/uploads
